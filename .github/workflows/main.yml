name: CI

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository...
        uses: actions/checkout@v5
      - name: Run tests...
        uses: ./.github/action-test
        with:
          command: ${{ (github.ref == 'refs/heads/master' || github.base_ref == 'master') && 'multitest' || 'doctest' }}
      - name: Deploy documentation...
        if: github.event_name == 'push' && github.repository == 'fcpp/fcpp'
        run: npx surge './src/doc/html' 'fcpp-doc.surge.sh' --token ${{ secrets.SURGE_TOKEN }}
